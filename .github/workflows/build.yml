name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlarni yuklab olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Android papkani yaratish va asl ANYtoANY kodlarini tiklash
        run: |
          cp pubspec.yaml /tmp/user_pubspec.yaml
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/user_main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/user_main.dart
          fi
          flutter create --platforms=android --org com.anytoany.converter --project-name any_to_any .
          cp /tmp/user_pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/user_main.dart lib/main.dart
          # minSdk 24 (ffmpeg_kit talabi): eski Groovy va yangi Kotlin DSL andozalari uchun
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g; s/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$f"
            fi
          done
          sed -i 's/android:label="any_to_any"/android:label="ANYtoANY"/' android/app/src/main/AndroidManifest.xml
          # Qo'llab-quvvatlash raqamini telefon ilovasida ochish uchun (tel: havolasi)
          sed -i 's#<queries>#<queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW"/>\n            <data android:scheme="tel"/>\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.DIAL"/>\n            <data android:scheme="tel"/>\n        </intent>#' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Kutubxonalarni o'rnatish
        run: flutter pub get

      - name: Release APK yig'ish
        run: flutter build apk --release

      - name: Tayyor APK faylni yuklashga chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: ANYtoANY-Full-APK
          path: build/app/outputs/flutter-apk/app-release.apk
