name: any_to_any
description: ANYtoANY - Universal Offline Media & PDF Converter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  anytoany_core:
    path: packages/anytoany_core
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  android_id: ^0.6.0
  file_picker: ^13.3.3
  ffmpeg_kit_flutter_new: ^4.6.8
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  pdf: ^3.13.1
  video_player: ^2.14.1
  video_player_win: ^3.3.1
  wakelock_plus: ^1.8.2
  url_launcher: ^6.3.3
  photo_manager: ^3.12.0
  pdf_combiner: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/auth.jpg
    - assets/logo.png
    - assets/backgrounds/
